name: Feature Request
description: Suggest a new generator capability or documentation improvement
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Use this template for **new capabilities** or **meaningful doc / tooling** changes. For small typos in README, a PR is often enough.

  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What is painful, missing, or inconsistent today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How you imagine it working (API shape, attributes, diagnostics, etc.).
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other ways to solve the same problem, or why not use existing Prism / MVVM patterns.

  - type: dropdown
    id: area
    attributes:
      label: Primary area
      options:
        - ObservableProperty / Notify attributes
        - DelegateCommand / AsyncDelegateCommand
        - BindableBase / INotifyPropertyChanging
        - Diagnostics (PSGxxxx)
        - NuGet / MSBuild / multi-Roslyn packaging
        - Samples / tests / CI
        - Wiki / README only
        - Other
    validations:
      required: true

  - type: checkboxes
    id: terms
    attributes:
      label: Confirmation
      options:
        - label: I have searched existing issues for duplicates
          required: true
